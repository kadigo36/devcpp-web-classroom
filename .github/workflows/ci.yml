name: CI

on:
  push:
    branches: [main, "develop/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@1e60f620b9541dacc78c0b0d4a4846d05a1263a1
        with:
          node-version: "22"
      - run: npm test
