<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Dev-C++ Web Classroom</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <header>
    <strong>Dev-C++ Web Classroom</strong>
    <div class="header-meta">
      <span>v0.5 · C/C++ local no navegador</span>
      <span id="networkStatus" class="status-pill">A verificar rede…</span>
    </div>
  </header>

  <main>
    <nav class="toolbar">
      <button id="newProject">Novo projeto</button>
      <button id="newFile">Novo ficheiro</button>
      <button id="open">Importar ficheiro</button>
      <button id="save">Exportar ficheiro</button>
      <button id="exportProject">Exportar projeto</button>
      <button id="importProject">Importar projeto</button>
      <button id="backupProject">Criar backup</button>
      <button id="restoreProject">Restaurar backup</button>
      <button id="compile" class="primary">Compilar e executar</button>
      <button id="stop" disabled>Parar</button>
      <input id="file" type="file" accept=".c,.cc,.cpp,.cxx,.h,.hpp,.txt,.dat,.csv" hidden>
      <input id="projectFile" type="file" accept=".json,.devcpp.json,application/json" hidden>
      <span id="phase" class="phase" aria-live="polite"></span>
    </nav>

    <section class="workspace">
      <aside class="files-panel">
        <div class="panel-title">
          <h2>Projeto</h2>
          <span id="saved">Guardado</span>
        </div>
        <div id="fileList" class="file-list" aria-label="Ficheiros do projeto"></div>
        <button id="deleteFile" class="danger ghost">Eliminar ficheiro atual</button>
        <p class="note">Persistência local em IndexedDB, com backups e ficheiros de dados virtuais. Sem autocomplete, autocorreção ou diagnósticos.</p>
      </aside>

      <article class="editor-panel">
        <div class="editor-title">
          <input id="filename" aria-label="Nome do ficheiro atual" readonly>
          <span id="language"></span>
        </div>
        <textarea id="editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" aria-label="Código-fonte"></textarea>
      </article>
    </section>

    <section class="io-grid">
      <div class="console input-panel">
        <h2>Entrada (stdin)</h2>
        <textarea id="stdin" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="Dados fornecidos ao programa antes da execução"></textarea>
        <h2>Argumentos do programa</h2>
        <textarea id="args" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="Um argumento por linha"></textarea>
      </div>
      <div class="console">
        <h2>Consola</h2>
        <pre id="output" aria-live="polite"></pre>
      </div>
    </section>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
